org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# NOTE: do not set org.gradle.java.home here -- it is a machine-specific absolute path and
# breaks CI. Pass -Dorg.gradle.java.home=... on the command line instead, exactly as MelonHack
# does, or set it in your personal ~/.gradle/gradle.properties.

maven_group=com.melonboard
archives_base_name=MelonBoard
